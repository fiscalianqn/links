<style>
  :root {
    --bg: #F5F1E8;
    --surface: #FFFDF8;
    --surface-2: #EFE8D8;
    --ink: #1B2731;
    --ink-soft: #5B6670;
    --line: #E3DBC8;
    --brand: #2B3E4C;
    --brand-ink: #F4DFB9;
    --accent: #4F8A2F;
    --accent-soft: #E3EED8;
    --star: #C98A12;
    --focus: #2F6FB0;

    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10161B;
      --surface: #18212A;
      --surface-2: #222D37;
      --ink: #E9EEF2;
      --ink-soft: #95A3AF;
      --line: #2A3641;
      --brand: #0B1116;
      --brand-ink: #F4DFB9;
      --accent: #8CC46A;
      --accent-soft: #23331C;
      --star: #F0B53C;
      --focus: #6FA8E0;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3);
      --shadow-hover: 0 10px 28px rgba(0, 0, 0, .45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10161B;
    --surface: #18212A;
    --surface-2: #222D37;
    --ink: #E9EEF2;
    --ink-soft: #95A3AF;
    --line: #2A3641;
    --brand: #0B1116;
    --brand-ink: #F4DFB9;
    --accent: #8CC46A;
    --accent-soft: #23331C;
    --star: #F0B53C;
    --focus: #6FA8E0;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    --shadow-hover: 0 10px 28px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ---------- Encabezado ---------- */
  header {
    background: var(--brand);
    color: var(--brand-ink);
    position: relative;
    padding: 22px 0 50px;
  }
  header::after {
    /* franja verde institucional */
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 4px;
    background: #87B867;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }
  .logo {
    height: 64px;
    width: auto;
    max-width: 60vw;
    object-fit: contain;
    display: block;
  }
  .title {
    margin: 40px 0 0;
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: clamp(22px, 2.4vw, 27px);
    line-height: 1.2;
    letter-spacing: 0;
  }
  .subtitle {
    margin: 2px 0 0;
    font-size: 14px;
    opacity: .65;
  }

  /* Selector de tema */
  .theme {
    display: inline-flex;
    background: rgba(255, 255, 255, .08);
    border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 999px;
    padding: 3px;
    flex-shrink: 0;
  }
  .theme button {
    font: inherit;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--brand-ink);
    background: transparent;
    border: 0;
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
    opacity: .7;
    transition: background-color .15s, opacity .15s;
  }
  .theme button:hover { opacity: 1; }
  .theme button[aria-pressed="true"] {
    background: var(--brand-ink);
    color: var(--brand);
    opacity: 1;
  }

  /* ---------- Buscador ---------- */
  .search {
    position: relative;
    margin-top: -30px;
    z-index: 1;
  }
  .search svg {
    position: absolute;
    left: 20px;
    top: 50%;
    width: 20px;
    height: 20px;
    transform: translateY(-50%);
    color: var(--ink-soft);
    pointer-events: none;
  }
  .search input {
    width: 100%;
    height: 60px;
    padding: 0 64px 0 54px;
    font: inherit;
    font-size: 17px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow-hover);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .search input::placeholder { color: var(--ink-soft); }
  .search input:focus {
    border-color: var(--focus);
    box-shadow: var(--shadow-hover), 0 0 0 4px color-mix(in srgb, var(--focus) 20%, transparent);
  }
  .search input::-webkit-search-cancel-button { display: none; }
  .kbd {
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 6px;
    padding: 1px 8px;
    pointer-events: none;
  }
  .hint {
    margin: 10px 4px 0;
    font-size: 13px;
    color: var(--ink-soft);
    min-height: 20px;
  }

  /* ---------- Secciones ---------- */
  main.wrap { flex: 1; padding-bottom: 56px; }
  section { margin-top: 32px; }
  .section-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 0 0 14px;
  }
  .section-head h2 {
    margin: 0;
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: -.005em;
  }
  .count {
    font-size: 13px;
    color: var(--ink-soft);
  }
  [hidden] { display: none !important; }

  .grid {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 12px;
  }

  /* ---------- Tarjetas ---------- */
  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-hover);
    border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
  }
  .card a {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 44px 14px 14px;
    color: inherit;
    text-decoration: none;
    border-radius: 12px;
    min-height: 72px;
  }
  .card a:focus-visible,
  .star:focus-visible,
  .theme button:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  .card.first a {
    box-shadow: inset 0 0 0 2px var(--focus);
  }
  .icon {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    background: var(--accent-soft);
    color: var(--accent);
    transition: transform .18s ease;
  }
  .card:hover .icon { transform: scale(1.06); }
  .icon svg { width: 22px; height: 22px; }
  .text { min-width: 0; }
  .name {
    display: block;
    white-space: pre-line;
    font-weight: 600;
    font-size: 13.5px;
    letter-spacing: .015em;
    line-height: 1.3;
  }
  .domain {
    display: block;
    margin-top: 3px;
    font-size: 12.5px;
    color: var(--ink-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tag {
    display: inline-block;
    margin-left: 6px;
    padding: 0 6px;
    font-size: 11px;
    font-weight: 600;
    border-radius: 4px;
    background: var(--surface-2);
    color: var(--ink-soft);
    vertical-align: 1px;
  }
  mark {
    background: color-mix(in srgb, var(--star) 30%, transparent);
    color: inherit;
    border-radius: 2px;
  }

  /* Estrella de favorito */
  .star {
    position: absolute;
    top: 50%;
    right: 8px;
    transform: translateY(-50%);
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    opacity: 0;
    transition: opacity .15s, color .15s, background-color .15s;
  }
  .star svg { width: 18px; height: 18px; }
  .card:hover .star,
  .star:focus-visible,
  .star[aria-pressed="true"] { opacity: 1; }
  .star:hover { background: var(--surface-2); color: var(--star); }
  .star[aria-pressed="true"] { color: var(--star); }
  .star[aria-pressed="true"] svg { fill: currentColor; }
  @media (hover: none) { .star { opacity: .55; } }

  .empty {
    padding: 40px 16px;
    text-align: center;
    color: var(--ink-soft);
    border: 1px dashed var(--line);
    border-radius: 12px;
  }

  /* ---------- Pie ---------- */
  footer {
    background: var(--brand);
    color: var(--brand-ink);
    font-size: 13px;
    padding: 18px 0;
  }
  footer .wrap {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  footer span { opacity: .75; }

  @media (max-width: 600px) {
    .wrap { padding: 0 16px; }
    header { padding: 16px 0 46px; }
    .logo { height: 40px; max-width: 100%; }
    .title { margin-top: 28px; }
    .theme button { padding: 5px 9px; }
    .kbd { display: none; }
    .search input { height: 54px; padding-right: 16px; font-size: 16px; }
    .grid { grid-template-columns: 1fr; gap: 10px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

    descarga: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
    birrete: '<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/><line x1="22" y1="10" x2="22" y2="15"/>',
    balanza: '<line x1="12" y1="3" x2="12" y2="21"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="5" y1="7" x2="19" y2="7"/><path d="M5 7 2 14a3 3 0 0 0 6 0z"/><path d="M19 7l-3 7a3 3 0 0 0 6 0z"/>',
  };
  const ESTRELLA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><polygon points="12 2 15.1 8.3 22 9.3 17 14.1 18.2 21 12 17.8 5.8 21 7 14.1 2 9.3 8.9 8.3 12 2"/></svg>';

  // ---------- Almacenamiento seguro (puede fallar en modo privado) ----------
  const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const leer = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };

  // ---------- Tema ----------
  const botonesTema = document.querySelectorAll('.theme button');
  function aplicarTema(tema) {
    if (tema === 'claro') document.documentElement.dataset.theme = 'light';
    else if (tema === 'oscuro') document.documentElement.dataset.theme = 'dark';
    else delete document.documentElement.dataset.theme;
    botonesTema.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tema === tema)));
  }
  botonesTema.forEach(b => b.addEventListener('click', () => {
    guardar('fe-tema', b.dataset.tema);
    aplicarTema(b.dataset.tema);
  }));
  aplicarTema(leer('fe-tema') || 'auto');

  // ---------- Datos ----------
  const normalizar = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const escapar = (s) => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const dominio = (url) => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return url; } };

  const accesos = ACCESOS
    .map(a => ({ ...a, dominio: dominio(a.url), clave: normalizar(a.nombre.replace(/\n/g, ' ') + ' ' + dominio(a.url)) }))
    .sort((a, b) => a.nombre.localeCompare(b.nombre, 'es', { sensitivity: 'base' }));

  let favoritos;
  try { favoritos = new Set(JSON.parse(leer('fe-favoritos') || '[]')); } catch (e) { favoritos = new Set(); }

  // ---------- Render ----------
  const $buscar = document.getElementById('buscar');
  const $hint = document.getElementById('hint');
  const $gridTodos = document.getElementById('grid-todos');
  const $gridFav = document.getElementById('grid-favoritos');
  const $secFav = document.getElementById('sec-favoritos');
  const $vacio = document.getElementById('vacio');

  function resaltar(texto, consulta) {
    if (!consulta) return escapar(texto);
    const i = normalizar(texto).indexOf(consulta);
    if (i < 0) return escapar(texto);
    return escapar(texto.slice(0, i)) + '<mark>' + escapar(texto.slice(i, i + consulta.length)) + '</mark>' + escapar(texto.slice(i + consulta.length));
  }

  function tarjeta(a, consulta) {
    const fav = favoritos.has(a.url);
    const attrs = a.descarga ? 'download' : 'target="_blank" rel="noopener noreferrer"';
    return `<li class="card">
      <a href="${escapar(a.url)}" ${attrs}>
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONOS[a.icono] || ICONOS.doc}</svg></span>
        <span class="text">
          <span class="name">${resaltar(a.nombre, consulta)}${a.descarga ? '<span class="tag">Descarga</span>' : ''}</span>
          <span class="domain">${resaltar(a.dominio, consulta)}</span>
        </span>
      </a>
      <button type="button" class="star" data-url="${escapar(a.url)}" aria-pressed="${fav}" aria-label="${fav ? 'Quitar de' : 'Agregar a'} favoritos: ${escapar(a.nombre)}" title="${fav ? 'Quitar de favoritos' : 'Agregar a favoritos'}">${ESTRELLA}</button>
    </li>`;
  }

  function render() {
    const consulta = normalizar($buscar.value.trim());
    const visibles = consulta ? accesos.filter(a => a.clave.includes(consulta)) : accesos;
    const favs = accesos.filter(a => favoritos.has(a.url));

    // Favoritos se ocultan mientras se busca, para que los resultados queden en una sola lista
    $secFav.hidden = consulta !== '' || favs.length === 0;
    $gridFav.innerHTML = favs.map(a => tarjeta(a, '')).join('');
    document.getElementById('count-favoritos').textContent = favs.length;

    $gridTodos.innerHTML = visibles.map(a => tarjeta(a, consulta)).join('');
    document.getElementById('count-todos').textContent = consulta ? `${visibles.length} de ${accesos.length}` : accesos.length;

    $vacio.hidden = visibles.length > 0;
    if (!visibles.length) $vacio.textContent = `No hay accesos que coincidan con «${$buscar.value.trim()}».`;

    if (consulta && visibles.length) {
      $gridTodos.firstElementChild.classList.add('first');
      $hint.textContent = `Enter abre «${visibles[0].nombre}» · Esc limpia la búsqueda`;
    } else {
      $hint.textContent = consulta ? '' : 'Escribí para filtrar · tecla / para buscar desde cualquier lugar';
    }
  }

  // ---------- Eventos ----------
  $buscar.addEventListener('input', render);
  $buscar.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const primero = $gridTodos.querySelector('.card a');
      if ($buscar.value.trim() && primero) primero.click();
    } else if (e.key === 'Escape') {
      $buscar.value = '';
      render();
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== $buscar && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      $buscar.focus();
      $buscar.select();
    }
  });
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.star');
    if (!btn) return;
    const url = btn.dataset.url;
    favoritos.has(url) ? favoritos.delete(url) : favoritos.add(url);
    guardar('fe-favoritos', JSON.stringify([...favoritos]));
    render();
  });

  render();
</script>
</body>
</html>
